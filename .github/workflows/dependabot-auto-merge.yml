name: Dependabot auto-merge (reusable)

# Centralized auto-merge for Dependabot patch/minor bumps across dcyfr-labs repos.
# Major bumps are never auto-merged - they stay open for manual review.
#
# Strategy. First count the status checks the base branch REQUIRES (rulesets
# plus classic branch protection; a lookup that errors counts as none).
#
# Base branch REQUIRES checks, in order:
#   1. Native auto-merge (gh pr merge --auto), with the "Allow auto-merge" repo
#      setting. GitHub merges server-side once all REQUIRED checks pass -
#      optional/flaky checks (visual snapshots, Vercel previews, secret-gated
#      scanners that fail on Dependabot-triggered runs) cannot block the merge,
#      and no runner is held while waiting.
#   2. "Clean status" rejection means everything is already green: merge directly.
#   3. Polling fallback when native auto-merge is unavailable (repo setting
#      off): wait for ALL checks, then merge.
#
# Base branch requires NO checks (private repos on the GitHub Free org plan,
# where rulesets are unavailable, or a public repo with none configured):
#   Never arm native auto-merge. With nothing required, GitHub treats the PR as
#   mergeable at once and `gh pr merge --auto` merges it on the spot, before CI
#   has started (dcyfr-labs#957-#965, 2026-10-02). Instead look at the checks
#   ONCE: all finished and green merges, any failed or cancelled hands off, and
#   anything still running withholds. No polling, because a waiting job bills
#   Actions minutes on a private repo for the whole length of CI. A withheld PR
#   is merged by dependabot-auto-merge-sweep.yml, so a repo on this path NEEDS
#   a sweep caller, or its patch/minor PRs never merge.
#
# Called by each repo's thin .github/workflows/dependabot-auto-merge.yml caller.
#
# Supply-chain cooldown: npm bumps are additionally gated on package AGE. A
# self-propagating worm (Shai-Hulud, 2026-08-04) republishes hijacked packages
# as PATCH bumps, which is exactly what this workflow auto-merges. Advisory
# databases lag publication by hours-to-days, so `npm audit` returns clean for
# a version minted minutes ago - CVE-based gates structurally cannot catch it.
# Age is the signal that does not lag. The gate FAILS CLOSED: an unreachable
# registry or a missing publish timestamp withholds auto-merge rather than
# waving it through.
#
# WHY THIS FILE IS PR MODE ONLY (regression, 2026-08-31 - 2026-09-05):
#
# Sweep mode used to live here as a second job, and its `gh run rerun` call
# needed `actions: write`. A reusable workflow may not request more permission
# than its caller grants, and every caller in the org grants exactly
# `contents: write` + `pull-requests: write` - so from the moment sweep landed
# (#6, 2026-08-27) EVERY call of this workflow died at `startup_failure` before
# running a single step. Not a failing check: no check at all. The PR just sat
# there looking green, because the merge job that should have acted on it never
# started. 20 of 20 repos, silent, for 5 days; 73 mergeable PRs stranded.
#
# The permission ceiling applies to the whole called workflow, so an `if:`-false
# job cannot opt out of it - the only fix that holds is for the file a PR-mode
# caller invokes to never ask for more than a PR-mode caller grants. Hence the
# split: sweep is dependabot-auto-merge-sweep.yml, and its callers (schedule /
# workflow_dispatch) are the only ones that grant `actions: write`.
#
# Adding a permission here is therefore a BREAKING change to every caller. If a
# future step needs one, give it its own file rather than widening this one.
#
# MANUAL REVIEW HAND-OFF. A PR this workflow will not merge used to be left with
# no signal at all: no assignee, no label, nothing in anyone's queue. The last
# step now assigns `review-assignee` and applies `review-label` when a human is
# needed: a major or unclassified bump, failed or cancelled checks, a polling
# timeout, or an auto-merge step that errored. Age-cooldown withholds and
# CI-still-running withholds (no required checks) are NOT handed off, because
# sweep merges those once the cooldown expires or CI goes green. Assignment
# and labelling need only `pull-requests: write`, which every caller already
# grants, and the step never fails the job.
#
# MERGE RACES ARE NOT HANDED OFF. Sweep re-runs every withheld PR in a repo
# back to back, so their merges race each other. The loser sees "Base branch
# was modified", and a lockfile-sharing loser then sees "merge conflicts".
# Those used to fail the step and hand the PR to a human (2026-10-02: four
# PRs assigned and labelled, all of which merged untouched after Dependabot
# rebased them). A "Base branch was modified" merge is now retried. A conflict
# against a base commit under an hour old is withheld, because Dependabot
# rebases a conflicting PR on its own and that rebase's `synchronize` re-runs
# this job. Only a conflict Dependabot has left alone for an hour is handed
# off.

on:
  workflow_call:
    inputs:
      merge-method:
        description: "squash | merge | rebase"
        type: string
        default: squash
      timeout-minutes:
        description: "Polling fallback only: max minutes to wait for checks before deferring (never merges on timeout)"
        type: number
        default: 45
      min-package-age-days:
        description: "Withhold auto-merge for npm versions published fewer than N days ago (supply-chain cooldown). 0 disables."
        type: number
        default: 7
      review-assignee:
        description: "GitHub login assigned to PRs left for manual review. Empty disables assignment."
        type: string
        default: dcyfr
      review-label:
        description: "Label applied to PRs left for manual review (created on first use). Empty disables labelling."
        type: string
        default: needs-review

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # PR mode only. A scheduled run has no Dependabot actor, so this job would
    # skip on the actor check alone; naming the event keeps the two modes
    # readable side by side rather than implied.
    if: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ github.token }}

      # Supply-chain cooldown. Resolves every updated npm dependency's publish
      # timestamp from the registry and withholds auto-merge if ANY of them is
      # younger than the threshold. Grouped updates (the workspace groups
      # `all-npm: ["*"]`) are checked dependency-by-dependency - the youngest
      # member governs the whole PR.
      - name: Enforce minimum package age
        id: age
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        env:
          MIN_AGE_DAYS: ${{ inputs.min-package-age-days }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          UPDATED_JSON: ${{ steps.meta.outputs.updated-dependencies-json }}
        run: |
          set -uo pipefail

          if [ "${MIN_AGE_DAYS:-0}" -le 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Age gate disabled (min-package-age-days=0)."
            exit 0
          fi

          # Only npm has a registry publish timestamp to consult. github-actions
          # bumps are reviewed on their own track and pass through untouched.
          case "$ECOSYSTEM" in
            npm_and_yarn|npm|yarn|pnpm) ;;
            *)
              echo "ok=true" >> "$GITHUB_OUTPUT"
              echo "Ecosystem '$ECOSYSTEM' has no npm publish timestamp - age gate not applicable."
              exit 0 ;;
          esac

          if [ -z "${UPDATED_JSON:-}" ] || [ "$UPDATED_JSON" = "[]" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No dependency metadata resolved - withholding auto-merge (fail closed)."
            exit 0
          fi

          now="$(date -u +%s)"
          min_age_s=$(( MIN_AGE_DAYS * 86400 ))
          blocked=""
          checked=0

          while IFS=$'\t' read -r name version; do
            [ -n "$name" ] || continue
            checked=$(( checked + 1 ))
            if [ -z "$version" ]; then
              blocked="$blocked ${name}(no-version-in-metadata)"
              continue
            fi
            # @scope/pkg -> @scope%2Fpkg for the registry path.
            enc="$(printf '%s' "$name" | sed 's|/|%2F|g')"
            doc="$(curl -sS --fail --max-time 60 "https://registry.npmjs.org/${enc}" 2>/dev/null || true)"
            if [ -z "$doc" ]; then
              blocked="$blocked ${name}(registry-unreachable)"
              continue
            fi
            pub="$(printf '%s' "$doc" | jq -r --arg v "$version" '.time[$v] // empty' 2>/dev/null || true)"
            if [ -z "$pub" ]; then
              blocked="$blocked ${name}@${version}(no-publish-time)"
              continue
            fi
            pub_s="$(date -u -d "$pub" +%s 2>/dev/null || echo 0)"
            if [ "$pub_s" -le 0 ]; then
              blocked="$blocked ${name}@${version}(unparseable-timestamp)"
              continue
            fi
            age_s=$(( now - pub_s ))
            if [ "$age_s" -lt "$min_age_s" ]; then
              blocked="$blocked ${name}@${version}($(( age_s / 86400 ))d-old)"
            fi
          done < <(printf '%s' "$UPDATED_JSON" | jq -r '.[] | [.dependencyName, (.newVersion // "")] | @tsv')

          if [ "$checked" -eq 0 ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Parsed zero dependencies from metadata - withholding auto-merge (fail closed)."
            exit 0
          fi

          if [ -n "$blocked" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Auto-merge withheld. Younger than ${MIN_AGE_DAYS}d or unverifiable:${blocked}"
            echo "PR stays open for manual review - this is the supply-chain cooldown, not a failure."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "All ${checked} dependency version(s) are at least ${MIN_AGE_DAYS} days old."
          fi

      - name: Approve and auto-merge (patch/minor only)
        id: merge
        if: ${{ (steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor') && steps.age.outputs.ok == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          TIMEOUT_MIN: ${{ inputs.timeout-minutes }}
        run: |
          set -euo pipefail

          # Idempotency guard: synchronize/reopened events re-run this job.
          pr_state="$(gh pr view "$PR_URL" --json state,autoMergeRequest \
            --jq '[.state, (.autoMergeRequest != null | tostring)] | join(" ")')"
          case "$pr_state" in
            MERGED*)   echo "PR already merged - nothing to do."; exit 0 ;;
            *" true")  echo "Native auto-merge already armed - nothing to do."; exit 0 ;;
          esac

          # Bucket of every check on the PR EXCEPT this auto-merge workflow's own
          # (prefix-matched so it works whether GitHub attributes the check to the
          # caller or the reusable name), one per line. gh pr checks aggregates BOTH
          # Actions check-runs AND commit statuses (e.g. SonarCloud quality gate,
          # Socket Security). bucket in pass|fail|pending|skipping|cancel.
          check_buckets() {
            gh pr checks "$PR_URL" --json name,bucket,workflow \
              --jq '.[] | select((.workflow // "") | startswith("Dependabot auto-merge") | not) | .bucket' 2>/dev/null || true
          }

          # `gh pr merge` with the given flags. Sweep's re-runs race each other,
          # so "Base branch was modified" (another PR merged first) is retried;
          # any other error returns 1 at once.
          merge_with_retry() {
            local out attempt
            for attempt in 1 2 3; do
              if out="$(gh pr merge "$@" "$PR_URL" 2>&1)"; then
                printf '%s\n' "$out"
                return 0
              fi
              printf '%s\n' "$out"
              grep -qi 'base branch was modified' <<<"$out" || return 1
              [ "$attempt" -lt 3 ] || return 1
              echo "Base branch moved under the merge (attempt ${attempt}/3) - retrying in 15s."
              sleep 15
            done
          }

          # Prints fresh | stale | none. `mergeable` is computed lazily after
          # the base moves, so UNKNOWN is re-read a few times. "fresh" is a
          # conflict against a base commit under an hour old.
          conflict_state() {
            local m="" base_at base_s _
            for _ in 1 2 3; do
              m="$(gh pr view "$PR_URL" --json mergeable --jq .mergeable 2>/dev/null || true)"
              [ "$m" = UNKNOWN ] || break
              sleep 5
            done
            if [ "$m" != CONFLICTING ]; then echo none; return; fi
            base_at="$(gh api "repos/${REPO}/commits/${BASE_REF}" --jq '.commit.committer.date' 2>/dev/null || true)"
            base_s="$(date -u -d "$base_at" +%s 2>/dev/null || echo 0)"
            if [ "$base_s" -gt 0 ] && [ $(( $(date -u +%s) - base_s )) -lt 3600 ]; then
              echo fresh
            else
              echo stale
            fi
          }

          # Withholds a fresh conflict (Dependabot rebases it, which re-runs
          # this job) and hands off a stale one. Returns only when the PR does
          # not conflict.
          exit_on_conflict() {
            case "$(conflict_state)" in
              fresh)
                echo "::notice::Merge conflict against a base that moved in the last hour - Dependabot rebases conflicting PRs, and the rebase re-runs this job. Not handing off."
                exit 0 ;;
              stale)
                echo "::notice::Merge conflict that Dependabot has not rebased in an hour - leaving PR for manual review."
                echo "review=merge conflict Dependabot has not rebased" >> "$GITHUB_OUTPUT"
                exit 0 ;;
            esac
          }

          # Direct merge. A failure that is not a conflict fails the step, and
          # the hand-off step reports it as "auto-merge step failed".
          merge_now() {
            merge_with_retry --"$MERGE_METHOD" && return 0
            exit_on_conflict
            echo "::error::Merge failed - leaving PR for manual review."
            exit 1
          }

          # How many status checks does the base branch REQUIRE? Rulesets and
          # classic branch protection both count. A lookup that fails counts as
          # none, which is the safe direction: the rules endpoint answers 403 on
          # private repos on the Free plan, and `gh api` prints that error body to
          # stdout, so only a zero exit status is trusted.
          required=0
          for lookup in \
            "repos/${REPO}/rules/branches/${BASE_REF}|[.[] | select(.type == \"required_status_checks\")] | length" \
            "repos/${REPO}/branches/${BASE_REF}|(.protection.required_status_checks.contexts // []) | length"; do
            if n="$(gh api "${lookup%%|*}" --jq "${lookup#*|}" 2>/dev/null)"; then
              case "$n" in ''|*[!0-9]*) n=0 ;; esac
              required=$(( required + n ))
            fi
          done

          # NO REQUIRED CHECKS: never arm native auto-merge. With nothing to wait
          # for, `gh pr merge --auto` merges on the spot, before CI has even
          # started (dcyfr-labs#957-#965 merged with Test still queued,
          # 2026-10-02). Take one look at the PR's checks instead, and do NOT poll:
          # a polling job bills Actions minutes on a private repo for as long as
          # CI takes (24-70 min on dcyfr-labs), which would cost more than the
          # org's whole monthly allowance. A run that finds CI still going
          # withholds, exactly like the age cooldown, and sweep re-runs it later.
          if [ "$required" -eq 0 ]; then
            echo "No required status checks on '${BASE_REF}' - merging only on finished, green CI."
            buckets="$(check_buckets)"
            if grep -qE '^(fail|cancel)$' <<<"$buckets"; then
              echo "::notice::Checks failed or were cancelled - leaving PR for manual review."
              echo "review=checks failed or were cancelled" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -n "$buckets" ] && ! grep -q '^pending$' <<<"$buckets"; then
              gh pr review --approve "$PR_URL" || echo "approve skipped (non-fatal)"
              echo "All checks finished green - merging ($MERGE_METHOD)."
              merge_now
              exit 0
            fi
            echo "::notice::Auto-merge withheld until CI finishes: '${BASE_REF}' has no required checks, so arming auto-merge would merge before CI. The sweep re-runs this and merges once every check is green."
            exit 0
          fi

          gh pr review --approve "$PR_URL" || echo "approve skipped (non-fatal)"

          # 1) Native auto-merge: GitHub merges once the required checks pass.
          if out="$(merge_with_retry --auto --"$MERGE_METHOD")"; then
            echo "$out"
            echo "Native auto-merge armed - GitHub merges once required checks pass."
            exit 0
          fi
          echo "$out"

          # 2) Already green: GitHub rejects --auto with "clean status" - merge now.
          if grep -qi 'clean status' <<<"$out"; then
            merge_now
            exit 0
          fi

          # A conflicting PR cannot merge however long the checks take, so
          # settle that before polling bills any minutes.
          exit_on_conflict

          # 3) Polling fallback: checks are required but native auto-merge is
          #    unavailable (e.g. the "Allow auto-merge" repo setting is off).
          echo "Native auto-merge unavailable - falling back to check polling."
          deadline=$(( $(date +%s) + TIMEOUT_MIN * 60 ))
          while :; do
            buckets="$(check_buckets)"
            if [ -n "$buckets" ]; then
              if grep -qE '^(fail|cancel)$' <<<"$buckets"; then
                echo "::notice::Required checks failed or were cancelled - leaving PR for manual review."
                echo "review=checks failed or were cancelled" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if ! grep -q '^pending$' <<<"$buckets"; then
                echo "All checks green - merging ($MERGE_METHOD)."
                merge_now
                exit 0
              fi
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::notice::Timed out waiting for checks - leaving PR for manual review."
              echo "review=timed out waiting for checks" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done

      # Hand a PR this run will not merge to a human. Runs after a failed merge
      # step too (`!cancelled()`), since a merge that errored also strands the
      # PR. Every call is non-fatal: this step must never turn a green run red.
      - name: Assign for manual review
        if: ${{ !cancelled() && (inputs.review-assignee != '' || inputs.review-label != '') && ((steps.meta.outputs.update-type != 'version-update:semver-patch' && steps.meta.outputs.update-type != 'version-update:semver-minor') || steps.merge.outputs.review != '' || steps.merge.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ASSIGNEE: ${{ inputs.review-assignee }}
          LABEL: ${{ inputs.review-label }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          MERGE_REVIEW: ${{ steps.merge.outputs.review }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
        run: |
          set -uo pipefail

          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              if [ "$MERGE_OUTCOME" = "failure" ]; then
                reason="auto-merge step failed"
              else
                reason="$MERGE_REVIEW"
              fi ;;
            version-update:semver-major) reason="major version bump" ;;
            *) reason="unclassified update type '${UPDATE_TYPE:-none}'" ;;
          esac

          # Adding an assignee or label that is already present is a no-op, so
          # synchronize/reopened re-runs are safe. A login without push access
          # is silently ignored by the API, not rejected.
          issue="repos/${REPO}/issues/${PR_NUMBER}"
          if [ -n "$ASSIGNEE" ]; then
            if gh api -X POST "${issue}/assignees" -f "assignees[]=${ASSIGNEE}" --silent; then
              echo "Assigned ${ASSIGNEE}."
            else
              echo "::warning::Could not assign ${ASSIGNEE} (non-fatal)."
            fi
          fi
          if [ -n "$LABEL" ]; then
            # First use in a repo creates the label; 422 (already exists) is expected after that.
            gh api -X POST "repos/${REPO}/labels" -f name="$LABEL" -f color=d93f0b \
              -f description="Dependabot PR that auto-merge left for a human" --silent >/dev/null 2>&1 || true
            if gh api -X POST "${issue}/labels" -f "labels[]=${LABEL}" --silent; then
              echo "Labelled ${LABEL}."
            else
              echo "::warning::Could not apply label ${LABEL} (non-fatal)."
            fi
          fi
          echo "::notice::Left for manual review: ${reason}."
          exit 0
